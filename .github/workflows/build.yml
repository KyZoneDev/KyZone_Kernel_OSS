name: Build OSS Kernel Garnet (Clean Build)

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Branch Kernel OSS Garnet'
        required: true
        default: '16.0'
        type: choice
        options:
          - '16.0'
          - '17.0'
          - '15.0'

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Bersihkan Ruang Penyimpanan Server
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: 2. Install Paket Pendukung Kompilasi
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool lz4 libncurses5 libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 \
            pahole dwarves zstd jq patch binutils xz-utils

      - name: 3. Download Source Kernel OSS Garnet Beserta Submodule
        run: |
          git clone --depth=1 --recurse-submodules -b ${{ github.event.inputs.kernel_branch }} \
            https://github.com/crdroidandroid/android_xiaomi_kernel_garnet.git kernel
          cd kernel
          git submodule update --init --recursive

      - name: 4. Cek & Integrasi KernelSU-Next + SUSFS
        run: |
          cd kernel
          if [ ! -f "include/linux/susfs.h" ]; then
            git clone --depth=1 -b gki-android12-5.10 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
            cp -r /tmp/susfs4ksu/kernel_patches/fs/* fs/
            cp -r /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/
            patch -p1 --forward --fuzz=3 < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch || true
          fi

          if [ ! -f "drivers/kernelsu/Makefile" ] && [ ! -f "drivers/kernelsu/Kbuild" ]; then
            rm -rf KernelSU-Next drivers/kernelsu
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          fi

      - name: 5. Download Toolchain Clang
        run: |
          mkdir -p clang
          CLANG_URL=$(curl -s https://api.github.com/repos/ZyCromerZ/Clang/releases/latest | jq -r '.assets[0].browser_download_url')
          curl -L "$CLANG_URL" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: 6. Siapkan Konfigurasi Defconfig Garnet
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"

          if [ -f "arch/arm64/configs/vendor/garnet_GKI.config" ]; then
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig vendor/garnet_GKI.config
          else
            make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          fi

          # Aktifkan KSU-Next & SUSFS secara penuh di .config
          ./scripts/config --file out/.config \
            -d WERROR \
            -d TRIM_UNUSED_KSYMS \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_OPEN_REDIRECT

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: 7. Mulai Kompilasi Kernel (Build)
        run: |
          set -o pipefail
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"

          if ! make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error -w" \
            Image 2>&1 | tee build.log; then
              grep -E "error:|fatal error:|No rule to make target|undefined reference" build.log || tail -n 50 build.log
              exit 1
          fi

      - name: 8. Bungkus dengan AnyKernel3 Anti-Bootloop
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/

          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=KyZone OSS Kernel Garnet (KSU-Next + SUSFS)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          NO_BLOCK_DISPLAY=1;
          NO_MAGISK_CHECK=1;

          . tools/ak3-core.sh;

          split_boot;
          if [ -f "split_img/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi
          EOF

          cd AnyKernel3
          zip -r9 "${GITHUB_WORKSPACE}/KyZone-Garnet-KSUNext-SUSFS-$(date +%Y%m%d).zip" *

      - name: 9. Upload Hasil Build ke Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KyZone-Garnet-KSUNext-SUSFS
          path: ${{ github.workspace }}/KyZone-Garnet-KSUNext-SUSFS-*.zip
          retention-days: 14
